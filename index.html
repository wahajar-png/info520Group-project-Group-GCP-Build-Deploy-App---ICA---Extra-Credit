
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Events Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>City Events Finder</h1>
        <p>Find upcoming events happening in your city.</p>
    </header>

    <main>
        <section class="search-section">
            <h2>Discover Local Events</h2>
            <p>Enter a city to see what's happening.</p>

            <form id="search-form">
                <input
                    type="text"
                    id="city-input"
                    placeholder="Enter a city, such as Richmond"
                    value="Richmond"
                    required
                >
                <button type="submit">Search Events</button>
            </form>
        </section>

        <section class="results-section">
            <h2>Upcoming Events</h2>

            <p id="status-message">
                Search for a city to find upcoming events.
            </p>

            <div id="events-list"></div>
        </section>
    </main>

    <footer>
        <p>City Events Finder | INFO 520 Group Project</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
